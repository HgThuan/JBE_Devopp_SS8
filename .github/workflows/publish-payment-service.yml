name: Build, Verify & Publish Payment Service to GHCR

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ex01 - Verify Docker-outside-of-Docker (DooD) Socket Mount
        run: |
          echo "=== 1. Test WITHOUT /var/run/docker.sock mount (Expected failure) ==="
          docker run --rm docker:26-cli docker info 2>&1 || true
          echo ""
          echo "=== 2. Test WITH /var/run/docker.sock mount (DooD Expected success) ==="
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock docker:26-cli docker info --format "ServerVersion={{.ServerVersion}}, OS={{.OperatingSystem}}, Arch={{.Architecture}}"

      - name: Ex02 - Build & Compare Cart Service (Single-stage vs Multi-stage)
        run: |
          cd ex_02
          docker build -t cart-service:multistage .
          docker build -t cart-service:single-stage -f - . << 'EOF'
          FROM eclipse-temurin:17-jdk-alpine
          WORKDIR /app
          COPY . .
          RUN ./gradlew bootJar --no-daemon
          EXPOSE 8080
          ENTRYPOINT ["sh", "-c", "java -jar build/libs/*.jar"]
          EOF
          echo "=== Image Size Comparison ==="
          docker images --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" | grep -E "REPOSITORY|cart-service"

      - name: Ex03 - Normalize GitHub owner to lowercase
        id: meta
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=${OWNER_LOWER}" >> "$GITHUB_OUTPUT"
          echo "Normalized owner: ${OWNER_LOWER}"

      - name: Ex03 - Login to GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Ex03 - Build & Push payment-service:1.0.0 to GHCR
        run: |
          IMAGE_TAG="ghcr.io/${{ steps.meta.outputs.owner }}/payment-service:1.0.0"
          echo "Building $IMAGE_TAG..."
          docker build -t "$IMAGE_TAG" ./ex_03/payment-service
          docker push "$IMAGE_TAG"
          docker images "$IMAGE_TAG"
